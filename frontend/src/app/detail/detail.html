<app-header></app-header>
<main class="w-full min-h-full bg-[#2E3133] p-12 px-48 text-xl text-[#FFF1E7]">
    <div class="p-12 bg-[#252525] rounded-xl flex flex-col items-center justify-center">
            @if (habitLogs().length) {
                <span class="flex flex-row items-center gap-40 mb-6">
                    <h2 class="text-3xl font-semibold">{{ habitName() }}</h2>
                    <p>Longest Streak: {{ longestStreak().length }}</p>
                </span>
                <span class="flex flex-row items-center gap-40 mb-12">
                    <button (click)="onMonthBefore()">Left</button>
                    <button (click)="onMonthAfter()">Right</button>
                </span>
                <div class="grid grid-cols-7 gap-2 w-175">
                @for (day of calendarDays(); track day) {
                    @if (day) {
                    <div class="flex items-center justify-center h-17">
                        @if (isCompleted(day)) {
                        <div class="w-full h-full border flex flex-row items-center justify-around rounded-md">
                            <p> {{ day.getDate() }}</p>
                            <span [style.background-color]="habitColor()" class="w-3 h-3 rounded-full"></span>
                        </div>
                        } @else {
                        <div class="w-full h-full border flex flex-row items-center justify-around rounded-md">
                            <p> {{ day.getDate() }}</p>
                            <span [style.border-color]="habitColor()" class="w-3 h-3 rounded-full border"></span>
                        </div>
                        }
                    </div>
                    } @else {
                    <div></div>
                    }
                }
                </div>
            }
            @else () {
                <p>No logs to see here, for now...</p>
            }
        <app-add-log [id]="id()" (logAdded)="onLogAdded($event)" (trueAdded)="onTrueAdded($event)"></app-add-log>
    </div>
</main>
